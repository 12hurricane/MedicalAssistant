# MedAssist AI — Railway Deployment Configuration
# Backend service: FastAPI with PostgreSQL
# https://docs.railway.app/reference/config-as-code

[build]
# Use Dockerfile from backend directory
dockerfile = "backend/Dockerfile"

[deploy]
startCommand = "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers --forwarded-allow-ips=*"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
