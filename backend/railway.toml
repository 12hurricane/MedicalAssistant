# MedAssist AI — Railway Deployment Configuration
# Backend service: FastAPI with PostgreSQL
# https://docs.railway.app/reference/config-as-code

[build]
# Use Dockerfile from the backend sub-directory
dockerfile = "backend/Dockerfile"

[deploy]
# preDeployCommand runs BEFORE traffic is shifted to the new instance.
# If the migration fails the deploy is aborted — the previous healthy
# instance keeps serving traffic and no broken schema reaches production.
preDeployCommand = "alembic upgrade head"

# startCommand overrides the Dockerfile CMD on Railway only.
# Alembic is intentionally absent here; it already ran in preDeployCommand.
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --proxy-headers --forwarded-allow-ips=*"

healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
