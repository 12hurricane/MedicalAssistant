[pytest]
# pytest-asyncio defaults to strict mode, which silently refuses to run any
# async test that lacks an explicit @pytest.mark.asyncio decorator -- it reports
# "async def functions are not natively supported" and fails, which reads like a
# missing dependency rather than a missing marker. Nearly every test here is
# async against an AsyncSession, so auto mode is the sane default.
asyncio_mode = auto

# Only files that actually contain test functions. Several test_*.py files at the
# repo root are standalone scripts with __main__ blocks and no test functions;
# they are runnable by hand but are not part of the suite.
testpaths = .
markers =
    live_llm: opt into calling the live local Ollama LLM daemon during tests

