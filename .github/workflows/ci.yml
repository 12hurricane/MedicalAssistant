name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend Unit & Contract Tests
  # ---------------------------------------------------------------------------
  backend-test:
    name: Backend Tests & Quality Gates
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "sqlite+aiosqlite:///./medication.db"
      SECRET_KEY: "ci-testing-secret-key-do-not-use-in-production"
      ENVIRONMENT: "development"
      DEBUG: "false"
      GEMINI_API_KEY: "mock_ci_key"
      GROQ_API_KEY: "mock_ci_key"
      HF_TOKEN: "mock_ci_token"
      PYTHONPATH: "."

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run LLM Router & Safety Boundary Tests
        working-directory: ./backend
        run: |
          python -m pytest test_llm_router.py test_agent_endpoint.py test_merge_boundary.py -v

      - name: Run E2E Adherence Lifecycle Verification
        working-directory: ./backend
        run: |
          # Apply database schema migrations
          alembic upgrade head

          # Start FastAPI server in background
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          
          # Wait for server /health endpoint to become responsive
          echo "Waiting for backend service to report healthy..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8000/health | grep -q '"status":"ok"'; then
              echo "Backend is ready!"
              break
            fi
            sleep 1
          done

          # Execute E2E Lifecycle Script
          python test_e2e_adherence_lifecycle.py

  # ---------------------------------------------------------------------------
  # 2. Docker & Packaging Verification
  # ---------------------------------------------------------------------------
  docker-verification:
    name: Docker & Packaging Verification
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: medassist-backend:ci-test

  # ---------------------------------------------------------------------------
  # 3. Flutter Web Client Validation
  # ---------------------------------------------------------------------------
  flutter-validation:
    name: Flutter Web Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        working-directory: ./flutter
        run: flutter pub get

      - name: Analyze Flutter Source Code
        working-directory: ./flutter
        run: flutter analyze --no-fatal-infos
