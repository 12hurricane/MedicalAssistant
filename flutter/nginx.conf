server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Root directory for Flutter Web release bundle
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse proxy for backend API calls
    location /api/v1/ {
        proxy_pass http://backend:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 90s;
    }

    # Cache content-hashed assets aggressively (Flutter fingerprints chunk names).
    # Safe to mark immutable because the URL changes on every rebuild.
    #
    # NOTE: nginx's add_header inheritance rule — any add_header in a location
    # block replaces ALL add_header directives from the parent server block for
    # that response.  Security headers must be repeated here explicitly.
    location ~* "\.[0-9a-f]{8,}\.(js|css|woff2?|eot|ttf|svg|png|gif|jpe?g|ico|wasm)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Do NOT mark un-hashed assets as immutable — flutter_service_worker.js,
    # manifest.json, favicon.ico, and icons/*.png share the same filename across
    # deployments.  Use a short must-revalidate TTL so browsers re-check them.
    #
    # Security headers repeated for the same add_header inheritance reason.
    location ~* \.(?:js|css|woff2?|eot|ttf|svg|png|gif|jpe?g|ico|wasm)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # HTML5 client-side routing fallback (for Flutter Web SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
